<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #game {
            width: 500px;
            height: 500px;
            background: yellow;
            position: relative;
            overflow: hidden;
            cursor: url(./cursor.png) 50 50, auto;
        }

        #game>img {
            height: 100px;
            position: absolute;
            user-select: none;
            -webkit-user-drag: none;
        }

        .blood {
            pointer-events: none;
            z-index: 0;
        }

        .target {
            z-index: 1;
        }
    </style>
</head>

<body>
    <input type="button" value="開始" id="btn-start">
    <br>
    <p>分數: <span id="text-score">0</span></p>
    <p>剩餘: <span id="text-time">0</span></p>
    <p>最高分玩家: <span id="text-highscore-name">-</span></p>
    <p>最高分分數: <span id="text-highscore-score">0</span></p>
    <div id="game">
        <!-- <img src="./kodai_sacabambaspis.png" alt=""> -->
    </div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js'
        integrity='sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw=='
        crossorigin='anonymous'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const GAME_TIME = 3

        // 分數
        let score = 0
        // 剩餘時間
        let timeLeft = 0
        // 計時器
        let timer = 0
        // 最高分
        const highscore = {
            name: '-',
            score: 0
        }

        if (localStorage.apple) {
            const data = JSON.parse(localStorage.apple)
            highscore.score = data.score
            highscore.name = data.name
            $('#text-highscore-name').text(highscore.name)
            $('#text-highscore-score').text(highscore.score)
        }

        $('#btn-start').on('click', function () {
            // 停用按鈕
            $(this).attr('disabled', true)
            // 重設分數
            score = 0
            $('#text-score').text(score)
            // 重設遊戲時間
            timeLeft = GAME_TIME
            $('#text-time').text(timeLeft)

            // setInterval 的 function 的 this 是 window
            // 先把點擊事件的 this 放進變數裡給後面使用
            const _this = this

            timer = setInterval(function () {
                // 倒數
                timeLeft--
                $('#text-time').text(timeLeft)

                // 隨機數字 >= 3 且區域內目標數量 < 10 才產生
                const random = Math.round(Math.random() * 10)
                if (random >= 3 && $('.target').length < 10) {
                    // 建立一個目標
                    const target = $('<img class="target" src="./kodai_sacabambaspis.png" alt="">')
                    // 隨機位置
                    const top = Math.round(Math.random() * 100) + '%'
                    const left = Math.round(Math.random() * 100) + '%'
                    target.css({ top, left })
                    // 放進區域內
                    $('#game').append(target)
                    move(target)
                }

                // 時間到
                if (timeLeft === 0) {
                    // 停止計時器
                    clearInterval(timer)
                    // 啟用開始按鈕
                    console.log(this)
                    $(_this).attr('disabled', false)
                    // 清空區域
                    $('#game').empty()

                    // 最高分
                    if (score > highscore.score) {
                        Swal.fire({
                            title: '最高分',
                            text: '請輸入名字',
                            input: 'text'
                        }).then(result => {
                            console.log(result)
                            const name = result.value || 'AAA'
                            highscore.score = score
                            highscore.name = name
                            $('#text-highscore-name').text(name)
                            $('#text-highscore-score').text(score)

                            // localStorage.setItem(資料名稱, 保存文字)
                            // localStorage.資料名稱 = 保存文字
                            localStorage.apple = JSON.stringify(highscore)
                        })
                    }
                }
            }, 1000)
        })

        function move(target) {
            // 隨機位置
            const top = Math.round(Math.random() * 100) + '%'
            const left = Math.round(Math.random() * 100) + '%'
            target.animate({ top, left }, 2000, function () {
                move(target)
            })
        }

        $('#game').on('click', '.target', function () {
            // 停止動畫
            $(this).stop()
            // 換一張圖
            $(this).attr('src', './blood.png')
            // 換 class
            $(this).removeClass('target').addClass('blood')
            // 分數
            score++
            $('#text-score').text(score)
        })
    </script>
</body>

</html>
